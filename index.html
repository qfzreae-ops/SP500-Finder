<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP500 Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 14px 40px}h1{margin:0 0 5px;font-size:28px}.sub{color:#6b7280;margin-bottom:20px}
input{width:100%;padding:15px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:#fff}
.status{margin:10px 2px;color:#6b7280;font-size:13px}.results{display:grid;gap:8px}.item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:13px 15px;cursor:pointer}
.ticker{font-weight:700;margin-right:8px}.company{color:#374151}.sector{font-size:12px;color:#9ca3af;margin-top:4px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-top:16px}.selected{font-size:14px;color:#6b7280}.name{font-size:22px;font-weight:700;margin-top:4px}
.price{font-size:38px;font-weight:800;margin:18px 0 8px}.change{font-size:17px;font-weight:700}.up{color:#dc2626}.down{color:#2563eb}.flat{color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.metric{background:#f9fafb;padding:12px;border-radius:10px}.label{font-size:12px;color:#6b7280}.value{margin-top:4px;font-weight:600}
.error{color:#b91c1c;background:#fef2f2;padding:12px;border-radius:10px;margin-top:14px}.empty{text-align:center;color:#6b7280;padding:20px}
</style>
</head>
<body><div class="wrap">
<h1>SP500 Finder</h1><div class="sub">S&P 500 종목 검색 · 최신 가격 조회</div>
<input id="search" type="search" placeholder="회사명 또는 티커 검색 (예: Apple, AAPL)">
<div id="status" class="status">데이터를 불러오는 중...</div><div id="results"></div><div id="detail"></div>
</div>
<script>
let stocks=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=v=>v==null||isNaN(v)?"-":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=(v,d=2)=>v==null||isNaN(v)?"-":Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

function render(q){
  $("results").innerHTML="";$("detail").innerHTML="";
  q=q.trim().toLowerCase();
  if(!q){$("status").textContent=`전체 ${stocks.length}개 종목 · 검색어를 입력하세요.`;return}
  const m=stocks.filter(s=>s.ticker.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)).slice(0,20);
  $("status").textContent=m.length?`${m.length}개 검색 결과`:"검색 결과가 없습니다.";
  if(!m.length){$("results").innerHTML='<div class="empty">회사명 또는 티커를 확인해 주세요.</div>';return}
  m.forEach(s=>{const e=document.createElement("div");e.className="item";e.innerHTML=`<span class="ticker">${esc(s.ticker)}</span><span class="company">${esc(s.name)}</span><div class="sector">${esc(s.sector)}</div>`;e.onclick=()=>show(s);$("results").appendChild(e)})
}
function show(s){
 const ch=Number(s.change??0),pct=Number(s.change_pct??0),cls=ch>0?"up":ch<0?"down":"flat",sign=ch>0?"+":"";
 $("detail").innerHTML=`<div class="card"><div class="selected">${esc(s.ticker)} · ${esc(s.exchange||"US")}</div>
 <div class="name">${esc(s.name)}</div><div class="price">${money(s.price)}</div>
 <div class="change ${cls}">${sign}${num(ch)} (${sign}${num(pct)}%)</div>
 <div class="grid"><div class="metric"><div class="label">전일 종가</div><div class="value">${money(s.previous_close)}</div></div>
 <div class="metric"><div class="label">거래량</div><div class="value">${s.volume==null?"-":Number(s.volume).toLocaleString("en-US")}</div></div>
 <div class="metric"><div class="label">섹터</div><div class="value">${esc(s.sector||"-")}</div></div>
 <div class="metric"><div class="label">데이터 시각</div><div class="value">${esc(s.as_of_kst||"-")}</div></div></div></div>`
}
async function load(){
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);const d=await r.json();stocks=d.stocks||[];$("status").textContent=`전체 ${stocks.length}개 종목 · 마지막 갱신 ${d.updated_at_kst||"-"}`}
 catch(e){$("status").textContent="데이터를 불러오지 못했습니다."; $("results").innerHTML='<div class="error">GitHub Actions 실행 상태와 data.json을 확인해 주세요.</div>'}
}
$("search").addEventListener("input",e=>render(e.target.value));load();
</script></body></html>
