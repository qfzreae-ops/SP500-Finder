<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP500 Finder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa; color: #111827;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 22px 14px 40px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { color: #6b7280; margin-bottom: 20px; }
    input {
      width: 100%; padding: 15px 16px; border: 1px solid #d1d5db;
      border-radius: 12px; font-size: 16px; outline: none;
      background: white;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
    .status { margin: 10px 2px; color: #6b7280; font-size: 13px; }
    .results { display: grid; gap: 8px; margin-top: 10px; }
    .item {
      background: white; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 13px 15px; cursor: pointer;
    }
    .item:hover { border-color: #93c5fd; }
    .ticker { font-weight: 700; margin-right: 8px; }
    .company { color: #374151; }
    .sector { color: #9ca3af; font-size: 12px; margin-top: 4px; }
    .card {
      background: white; border-radius: 16px; padding: 20px; margin-top: 16px;
      border: 1px solid #e5e7eb; box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .selected { font-size: 14px; color: #6b7280; }
    .name { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .price { font-size: 38px; font-weight: 800; margin: 18px 0 8px; }
    .change { font-size: 17px; font-weight: 700; }
    .up { color: #dc2626; } .down { color: #2563eb; } .flat { color: #6b7280; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .metric { background: #f9fafb; padding: 12px; border-radius: 10px; }
    .label { color: #6b7280; font-size: 12px; }
    .value { margin-top: 4px; font-weight: 600; }
    .error { color: #b91c1c; background: #fef2f2; padding: 12px; border-radius: 10px; margin-top: 14px; }
    .empty { color: #6b7280; padding: 20px 4px; text-align: center; }
    @media (max-width: 480px) {
      .wrap { padding-top: 18px; }
      .price { font-size: 32px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>SP500 Finder</h1>
  <div class="sub">S&P 500 종목 검색 · 최신 가격 조회</div>

  <input id="search" type="search" placeholder="회사명 또는 티커 검색 (예: Apple, AAPL)" autocomplete="off">
  <div id="status" class="status">데이터를 불러오는 중...</div>
  <div id="results" class="results"></div>
  <div id="detail"></div>
</div>

<script>
let stocks = [];

const search = document.getElementById("search");
const results = document.getElementById("results");
const detail = document.getElementById("detail");
const statusEl = document.getElementById("status");

function money(v) {
  if (v == null || Number.isNaN(Number(v))) return "-";
  return "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function num(v, digits=2) {
  if (v == null || Number.isNaN(Number(v))) return "-";
  return Number(v).toLocaleString("en-US", {minimumFractionDigits: digits, maximumFractionDigits: digits});
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function renderResults(q) {
  const query = q.trim().toLowerCase();
  results.innerHTML = "";
  detail.innerHTML = "";

  if (!query) {
    statusEl.textContent = `전체 ${stocks.length}개 종목 · 검색어를 입력하세요.`;
    return;
  }

  const matches = stocks.filter(s =>
    String(s.ticker).toLowerCase().includes(query) ||
    String(s.name).toLowerCase().includes(query)
  ).slice(0, 20);

  statusEl.textContent = matches.length ? `${matches.length}개 검색 결과` : "검색 결과가 없습니다.";

  if (!matches.length) {
    results.innerHTML = '<div class="empty">회사명 또는 티커를 확인해 주세요.</div>';
    return;
  }

  for (const s of matches) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div><span class="ticker">${esc(s.ticker)}</span><span class="company">${esc(s.name)}</span></div>
      <div class="sector">${esc(s.sector || "")}</div>
    `;
    el.onclick = () => showDetail(s);
    results.appendChild(el);
  }
}

function showDetail(s) {
  const ch = Number(s.change ?? 0);
  const pct = Number(s.change_pct ?? 0);
  const cls = ch > 0 ? "up" : ch < 0 ? "down" : "flat";
  const sign = ch > 0 ? "+" : "";

  detail.innerHTML = `
    <div class="card">
      <div class="selected">${esc(s.ticker)} · ${esc(s.exchange || "")}</div>
      <div class="name">${esc(s.name)}</div>
      <div class="price">${money(s.price)}</div>
      <div class="change ${cls}">${sign}${num(ch)} (${sign}${num(pct)}%)</div>
      <div class="grid">
        <div class="metric"><div class="label">전일 종가</div><div class="value">${money(s.previous_close)}</div></div>
        <div class="metric"><div class="label">거래량</div><div class="value">${s.volume == null ? "-" : Number(s.volume).toLocaleString("en-US")}</div></div>
        <div class="metric"><div class="label">섹터</div><div class="value">${esc(s.sector || "-")}</div></div>
        <div class="metric"><div class="label">데이터 시각</div><div class="value">${esc(s.as_of_kst || "-")}</div></div>
      </div>
    </div>
  `;
}

async function loadData() {
  try {
    const res = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) throw new Error("data.json HTTP " + res.status);
    const data = await res.json();
    stocks = data.stocks || [];
    statusEl.textContent = `전체 ${stocks.length}개 종목 · 마지막 갱신 ${data.updated_at_kst || "-"}`;
    search.disabled = false;
  } catch (e) {
    statusEl.textContent = "데이터를 불러오지 못했습니다.";
    results.innerHTML = `<div class="error">data.json을 불러올 수 없습니다. GitHub Actions 실행 상태를 확인해 주세요.</div>`;
    console.error(e);
  }
}

search.addEventListener("input", e => renderResults(e.target.value));
loadData();
</script>
</body>
</html>
